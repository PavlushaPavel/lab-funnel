name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Права, которые нужны деплою Pages из Actions
permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны: держим один активный, но не рвём уже идущий
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # base задаётся здесь, а не в vite.config.ts: путь публикации — свойство
        # деплоя, а не исходников. Абсолютный base обязателен, потому что SPA-фолбэк
        # отдаёт index.html на любой путь: при относительном './' адрес со слэшем
        # на конце (/lab-funnel/prefreim/) разрешал бы ассеты в несуществующий
        # /lab-funnel/prefreim/assets/ и давал белый экран.
        run: npm run build -- --base=/${{ github.event.repository.name }}/
        env:
          # Переменные сборки. Пустые значения безопасны: приложение показывает
          # честные заглушки вместо падения (см. ARCHITECTURE.md §10).
          VITE_ANALYTICS_URL: ${{ vars.VITE_ANALYTICS_URL }}
          VITE_CHECKOUT_URL: ${{ vars.VITE_CHECKOUT_URL }}
          VITE_ASSISTANT_CA_URL: ${{ vars.VITE_ASSISTANT_CA_URL }}
          VITE_ASSISTANT_ADS_URL: ${{ vars.VITE_ASSISTANT_ADS_URL }}
          VITE_SUPPORT_URL: ${{ vars.VITE_SUPPORT_URL }}

      - name: SPA fallback
        # GitHub Pages отдаёт 404 на любой путь кроме корня. Копия index.html
        # под именем 404.html делает маршрут /prefreim рабочим при прямом заходе.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
